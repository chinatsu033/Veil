name: build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma separated: android,windows,macos,linux)'
        default: 'android,windows,macos,linux'
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - name: Select platforms
        id: select
        env:
          PLATFORMS: ${{ github.event.inputs.platforms || 'android,windows,macos,linux' }}
        run: |
          all='[
            {"platform":"android","os":"ubuntu-latest"},
            {"platform":"windows","os":"windows-2022","arch":"amd64"},
            {"platform":"macos","os":"macos-15-intel","arch":"amd64"},
            {"platform":"macos","os":"macos-15","arch":"arm64"},
            {"platform":"linux","os":"ubuntu-22.04","arch":"amd64"},
            {"platform":"linux","os":"ubuntu-24.04-arm","arch":"arm64","flutter_channel":"master"}
          ]'
          include="$(jq -c --arg p "$PLATFORMS" \
            '($p | gsub(" "; "") | split(",")) as $w | map(select(.platform as $x | $w | index($x)))' <<<"$all")"
          test "$include" != '[]' || { echo "No platform matches '$PLATFORMS'" >&2; exit 1; }
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    needs: [ matrix ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android Signing
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERVICE_JSON: ${{ secrets.SERVICE_JSON }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
            {
              echo "keyAlias=$KEY_ALIAS"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
            } >> android/local.properties
          else
            echo "::warning::KEYSTORE secret missing, release APK will be debug-signed"
          fi
          if [ -n "$SERVICE_JSON" ]; then
            echo "$SERVICE_JSON" | base64 --decode > android/app/google-services.json
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust (Linux)
        if: matrix.platform == 'linux'
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch || 'all' }}
          workspaces: services/helper
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      # No stable Linux arm64 SDK archive; master clones the pinned tag.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter_channel || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        if: matrix.platform == 'macos'
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1)"
          test -n "$xcode" || xcode="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Setup NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart setup.dart ${{ matrix.platform }} --env stable -v

      - name: Verify macOS bundle
        if: matrix.platform == 'macos'
        run: |
          app="build/macos/Build/Products/Release/Veil.app"
          want=$([ "${{ matrix.arch }}" = arm64 ] && echo arm64 || echo x86_64)
          for bin in "$app/Contents/MacOS/Veil" "$app/Contents/MacOS/VeilCore"; do
            archs="$(lipo -archs "$bin")"
            echo "$bin: $archs"
            test "$archs" = "$want"
          done
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleName' \
            -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier'
          ls -la dist

      - name: Verify Linux packages
        if: matrix.platform == 'linux'
        run: |
          ls -la dist
          want=$([ "${{ matrix.arch }}" = arm64 ] && echo aarch64 || echo x86-64)
          file build/linux/*/release/bundle/Veil | tee /dev/stderr | grep -q "$want"
          foreign="$(find build/linux/*/release/bundle -type f -exec file {} + | grep ELF | grep -v "$want" || true)"
          test -z "$foreign" || { echo "Foreign-arch ELF files in bundle:" >&2; echo "$foreign" >&2; exit 1; }
          deb="$(ls dist/*.deb)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E 'usr/share/applications/|opt/Veil/Veil$'
          dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/share/applications/Veil.desktop
          file dist/*.AppImage | tee /dev/stderr | grep -q "$want"
          ls dist/*.rpm

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: ./dist
          overwrite: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Generate sha256
        run: |
          cd ./dist
          sha256sum ./* > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ./.github/release_notes.md
